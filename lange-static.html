<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lange Firm - Static Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .post {
      width: 600px;
      height: 750px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP HALF — dark navy */
    .half-top {
      flex: 1;
      background-color: #0a1628;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 48px 44px 54px;
      position: relative;
    }

    /* Gold left bar */
    .half-top::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 6px;
      height: 100%;
      background: #c9a84c;
    }

    /* BOTTOM HALF — slightly lighter navy */
    .half-bottom {
      flex: 1;
      background-color: #0f1e35;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px 48px 36px 54px;
      position: relative;
    }

    .half-bottom::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 6px;
      height: 100%;
      background: #c9a84c;
    }

    /* Gold divider between halves */
    .divider-bar {
      height: 3px;
      background: linear-gradient(to right, #c9a84c, rgba(201,168,76,0.2));
      margin-left: 6px;
    }

    /* Header row */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tag {
      background: #c9a84c;
      color: #0a1628;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 2px;
    }

    .logo {
      text-align: right;
    }

    .logo-name {
      font-family: 'Playfair Display', serif;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .logo-sub {
      color: #c9a84c;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* Labels */
    .label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .label-line {
      height: 1px;
      width: 28px;
    }

    .label-myth .label-line { background: #6677aa; }
    .label-reality .label-line { background: #c9a84c; }

    .label-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .label-myth .label-text { color: #6677aa; }
    .label-reality .label-text { color: #c9a84c; }

    /* Text blocks */
    .myth-text {
      font-size: 32px;
      line-height: 1.5;
      color: #6677aa;
      text-decoration: line-through;
      text-decoration-color: #334466;
      font-style: italic;
    }

    .reality-text {
      font-size: 32px;
      line-height: 1.5;
      color: #ffffff;
      font-weight: 500;
    }

    /* Footer CTA */
    .cta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cta {
      font-size: 13px;
      color: #c9a84c;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .website {
      font-size: 11px;
      color: #445577;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="post">

    <!-- TOP: Myth -->
    <div class="half-top">
      <div class="header">
        <div class="tag">Myth vs Reality</div>
        <div class="logo">
          <div class="logo-name">The Lange Firm</div>
          <div class="logo-sub">Employment Law · Texas</div>
        </div>
      </div>
      <div>
        <div class="label label-myth">
          <div class="label-line"></div>
          <div class="label-text">Myth</div>
        </div>
        <div class="myth-text">"HR is there to protect me."</div>
      </div>
    </div>

    <!-- Gold divider -->
    <div class="divider-bar"></div>

    <!-- BOTTOM: Reality -->
    <div class="half-bottom">
      <div>
        <div class="label label-reality">
          <div class="label-line"></div>
          <div class="label-text">Reality</div>
        </div>
        <div class="reality-text">HR is there to protect the company. If they failed you, you still have options.</div>
      </div>
      <div class="cta-row">
        <div class="cta">Know your rights. Talk to The Lange Firm.</div>
        <div class="website">langefirm.com</div>
      </div>
    </div>

  </div>
</body>
</html>
