<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Take Twitter - SEO</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@400;600;700;900&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 8px;font-family:'Montserrat',sans-serif}
.panel{width:1600px;height:900px;position:relative;transform-origin:top left;overflow:hidden}
.bg{position:absolute;inset:0;background-image:url('img/img08.png');background-size:cover;background-position:center top;opacity:.60}
.overlay{position:absolute;inset:0;background:linear-gradient(105deg,rgba(10,6,2,.85) 0%,rgba(10,6,2,.70) 55%,rgba(10,6,2,.30) 100%)}
.inner{position:relative;z-index:2;padding:88px 96px;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:900px}
.label{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;color:#d4621a;letter-spacing:5px;text-transform:uppercase;margin-bottom:36px}
.quote{font-family:'Playfair Display',serif;font-weight:900;font-size:68px;color:#fff;line-height:1.08;letter-spacing:-.5px;margin-bottom:36px}
.quote em{font-style:italic;color:#d4621a}
.sub{font-family:'DM Sans',sans-serif;font-weight:300;font-size:26px;color:rgba(255,255,255,.78);line-height:1.6;margin-bottom:48px}
.rule{width:52px;height:5px;background:#d4621a;margin-bottom:24px}
.brand{font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;color:#d4621a;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="inner">
    <p class="label">Opinión impopular</p>
    <h1 class="quote">Ser un buen abogado<br>ya no alcanza.<br>Si nadie te encuentra,<br><em>da igual.</em></h1>
    <p class="sub">El abogado que aparece primero en Google gana el caso antes de que empiece.</p>
    <div class="rule"></div>
    <span class="brand">@clickderechomkt</span>
  </div>
</div>
<script>
function scale(){const p=document.getElementById('panel');const s=Math.min(1,(window.innerWidth-16)/1600);p.style.transform='scale('+s+')';p.style.marginBottom=((900)*s-900)+'px';}
scale();window.addEventListener('resize',scale);
</script>
</body>
</html>
