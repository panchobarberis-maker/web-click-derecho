# Postgres para desarrollo local. Es la unica dependencia externa de la app.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: intake-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intake
    ports:
      - "5432:5432"
    volumes:
      - intake-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intake"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  intake-db:
