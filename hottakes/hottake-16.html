<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Take 16</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:0;font-family:'Inter',sans-serif}
.panel{width:1080px;height:1350px;position:relative;transform-origin:top left;background:#000;display:flex;flex-direction:column}
.tweet{background:#000;border:none;padding:90px 80px 0;width:1080px;min-height:1350px;position:relative;z-index:2;display:flex;flex-direction:column}
.tweet-header{display:flex;align-items:flex-start;gap:24px;margin-bottom:64px}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid #333}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top}
.user-info{flex:1}
.display-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:30px;color:#e7e9ea;line-height:1.2}
.verified{width:28px;height:28px;display:inline-block}
.handle{font-size:24px;color:#71767b;font-weight:400;margin-top:6px}
.x-logo{margin-left:auto;opacity:.45}
.tweet-text{font-size:56px;color:#e7e9ea;line-height:1.6;font-weight:400;margin-bottom:auto;padding-bottom:60px}
.tweet-text strong{font-weight:700;color:#fff}
.orange{color:#d4621a;font-weight:700}
.timestamp{font-size:24px;color:#71767b;padding:28px 0;border-top:1px solid #2f3336;border-bottom:1px solid #2f3336;margin-top:auto}
.timestamp span{color:#e7e9ea;font-weight:500}
.actions{display:flex;align-items:center;justify-content:space-between;padding:28px 12px 36px}
.action{display:flex;align-items:center;gap:14px;color:#71767b;font-size:24px;font-weight:400}
</style>
</head>

<script>
